<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="application-name" content="NTS-1.4-Lava">
<title>NTS-1.4-Lava Player</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="./channel-manager.js"></script><script src="./favorite-manager.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#0f0f15;font-family:system-ui,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh}
.player-container{position:relative;width:100%;max-width:900px;background:#000;border-radius:12px;overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,.6)}
video{width:100%;display:block;aspect-ratio:16/9;cursor:pointer;background:#000}
.live-badge{position:absolute;z-index:2;top:16px;left:16px;background:rgba(255,0,0,.8);color:#fff;padding:4px 10px;border-radius:4px;font-size:12px;font-weight:bold;display:none;text-transform:uppercase;letter-spacing:1px}
.live-badge.active{display:block;animation:pulse 2s infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.status{position:absolute;z-index:2;top:16px;right:16px;background:rgba(0,0,0,.65);color:#ccc;padding:5px 9px;border-radius:4px;font-size:12px}
.status.ready{color:#7dff9a}.status.error{color:#ff7777}
.controls{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.9));display:flex;flex-direction:column;padding:12px 16px;gap:10px;opacity:0;transition:opacity .3s}
.player-container:hover .controls,.player-container:focus-within .controls,.player-container.paused .controls{opacity:1}
.progress-bar-container{width:100%;height:6px;background:rgba(255,255,255,.2);border-radius:3px;cursor:pointer;position:relative}
.progress-bar{height:100%;width:0;background:#00ff66;border-radius:3px}
.control-buttons{display:flex;align-items:center;justify-content:space-between}.left-controls,.right-controls{display:flex;align-items:center;gap:8px}
button{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;font-size:14px;cursor:pointer;padding:6px 10px;border-radius:6px}
button:hover{background:rgba(255,255,255,.2)}button:focus-visible,input:focus-visible,select:focus-visible,.channel-item:focus-visible{outline:2px solid #00ff66;outline-offset:2px}button:disabled{opacity:.4;cursor:not-allowed}
.time-display{font-size:13px;color:#ccc;margin-left:4px}input[type=range]{width:80px;accent-color:#00ff66;cursor:pointer}
.hide-on-live{display:flex}.is-live .hide-on-live{display:none!important}.is-live .progress-bar-container{cursor:default}.is-live .progress-bar{width:100%;background:#f00}
@media(max-width:600px){.player-container{border-radius:0}.channel-selector{border-radius:8px;margin:8px auto;padding:10px}.channel-list{grid-template-columns:repeat(2,minmax(0,1fr));max-height:none}.channel-item{min-height:64px;padding:7px}.channel-meta strong{font-size:13px}.channel-logo{width:34px;height:34px}.channel-favorite{font-size:18px}.controls{padding:8px;gap:7px}.left-controls{gap:5px}button{padding:6px 8px}.time-display{font-size:12px}input[type=range]{width:65px}}
.channel-selector{max-width:900px;width:100%;margin:14px auto;background:#15151d;color:#fff;border-radius:12px;padding:14px}.channel-toolbar{display:flex;gap:8px;flex-wrap:wrap}.channel-toolbar input,.channel-toolbar select{flex:1;min-width:180px;background:#0d0d12;color:#fff;border:1px solid #30303a;border-radius:7px;padding:9px}.channel-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-top:12px;max-height:300px;overflow:auto}.channel-item{display:flex;align-items:center;gap:9px;text-align:left;background:#1d1d27;border:1px solid #30303a;padding:8px;border-radius:8px;min-height:58px}.channel-item.selected{border-color:#00ff66}.channel-logo{width:38px;height:38px;display:grid;place-items:center;flex:none;background:#fff;border-radius:6px;overflow:hidden}.channel-logo img{width:100%;height:100%;object-fit:contain}.logo-fallback{display:grid;place-items:center;width:100%;height:100%;font-size:11px;font-weight:700;color:#222}.channel-logo img + .logo-fallback{display:none}.channel-favorite{font-size:20px;line-height:1;color:#ffd84d;min-width:24px;text-align:center}.channel-meta{min-width:0}.channel-meta strong,.channel-meta small{display:block}.channel-meta strong{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.channel-meta small{color:#aaa;font-size:11px}.channel-state{margin-left:auto;font-size:10px;color:#00d95a}.channel-empty{padding:18px;text-align:center;color:#999}.channel-feedback{font-size:12px;min-height:18px;margin-top:9px;color:#aaa}.channel-feedback.error{color:#ff7777}.channel-feedback.success{color:#7dff9a}</style>
</head>
<body>
<div class="player-container paused" id="player" aria-label="NTS-1.4-Lava">
<div class="live-badge" id="live-badge">🔴 Direct</div>
<div class="status" id="status">Prêt</div>
<video id="video" playsinline preload="metadata"></video><iframe id="youtube-live" title="YouTube Live" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen style="display:none;width:100%;aspect-ratio:16/9;border:0;background:#000"></iframe>
<div class="controls" id="controls-container">
<div class="progress-bar-container" id="progress-container"><div class="progress-bar" id="progress-bar"></div></div>
<div class="control-buttons">
<div class="left-controls">
<button id="btn-play" type="button">▶ Lecture</button>
<button id="btn-rewind" class="hide-on-live" type="button">⏪ -60s</button>
<button id="btn-forward" class="hide-on-live" type="button">⏩ +60s</button>
<button id="btn-mute" type="button">🔊</button>
<input type="range" id="volume" min="0" max="1" step="0.05" value="1" aria-label="Volume">
<span class="time-display hide-on-live" id="time">00:00 / 00:00</span>
</div>
<div class="right-controls"><button id="btn-fullscreen" type="button">⛶</button></div>
</div>
</div>
</div>
<script>
const player=document.getElementById('player'),video=document.getElementById('video'),controlsContainer=document.getElementById('controls-container'),liveBadge=document.getElementById('live-badge'),status=document.getElementById('status'),btnPlay=document.getElementById('btn-play'),btnRewind=document.getElementById('btn-rewind'),btnForward=document.getElementById('btn-forward'),btnMute=document.getElementById('btn-mute'),volumeSlider=document.getElementById('volume'),progressBar=document.getElementById('progress-bar'),progressContainer=document.getElementById('progress-container'),timeDisplay=document.getElementById('time'),btnFullscreen=document.getElementById('btn-fullscreen');
let currentMode='replay',hls=null; const youtubeLive=document.getElementById('youtube-live');
function setStatus(text,type=''){status.textContent=text;status.className='status '+type}
function formatTime(seconds){if(!Number.isFinite(seconds)||seconds<0)return'00:00';const mins=Math.floor(seconds/60),secs=Math.floor(seconds%60);return String(mins).padStart(2,'0')+':'+String(secs).padStart(2,'0')}
function isReplaySeekable(){return currentMode==='replay'&&Number.isFinite(video.duration)&&video.duration>0}
function updateProgress(){if(currentMode==='live'){progressBar.style.width='100%';return}if(!isReplaySeekable()){progressBar.style.width='0%';timeDisplay.textContent='00:00 / 00:00';return}const percent=Math.min(100,Math.max(0,(video.currentTime/video.duration)*100));progressBar.style.width=percent+'%';timeDisplay.textContent=formatTime(video.currentTime)+' / '+formatTime(video.duration)}
function resetHls(){if(hls){hls.destroy();hls=null}}
function cleanup(){resetHls();video.pause();video.removeAttribute('src');video.load(); if(youtubeLive){youtubeLive.src='about:blank';youtubeLive.style.display='none';} video.style.display='block'; controlsContainer.style.display='flex'}
function applyMode(mode){currentMode=mode==='live'?'live':'replay';const live=currentMode==='live';controlsContainer.classList.toggle('is-live',live);liveBadge.classList.toggle('active',live);timeDisplay.textContent=live?'En direct':'00:00 / 00:00';updateProgress()}
function playWhenAllowed(){video.play().catch(()=>setStatus('Prêt — appuyez sur Lecture'))}
function loadRTIPlay(url, channelName='RTI — RTI Play'){cleanup();applyMode('live');controlsContainer.style.display='none';if(!url){setStatus('RTI Play indisponible','error');return}youtubeLive.src=url;youtubeLive.style.display='block';video.style.display='none';setStatus(channelName+' — RTI Play');}\nfunction loadNCILive(url='https://www.nci.ci/direct'){cleanup();applyMode('live');controlsContainer.style.display='none';if(!url){setStatus('NCI Live indisponible','error');return}youtubeLive.src=url;youtubeLive.style.display='block';video.style.display='none';setStatus('NCI — Direct');}\nfunction loadYouTubeLive(channelId){cleanup();applyMode('live'); controlsContainer.style.display='none'; if(!channelId){setStatus('Source YouTube invalide','error');return} if(!/^[A-Za-z0-9_-]{20,}$/.test(channelId)){setStatus('Identifiant YouTube invalide','error');return} youtubeLive.src='https://www.youtube.com/embed/live_stream?channel='+encodeURIComponent(channelId)+'&autoplay=1&controls=1&rel=0'; youtubeLive.style.display='block'; video.style.display='none'; setStatus('YouTube Live — chargement…')}
function loadNTSMedia(url,mode='replay'){cleanup();applyMode(mode);if(!url){setStatus('Aucun flux fourni','error');return}try{const parsed=new URL(url,location.href);if(!/^https?:$/.test(parsed.protocol))throw new Error('INVALID_URL')}catch(_){setStatus('URL de flux invalide','error');return}setStatus('Chargement…');const isHls=/\.m3u8(?:$|\?)/i.test(url);
if(isHls&&window.Hls&&Hls.isSupported()){hls=new Hls({enableWorker:true,lowLatencyMode:currentMode==='live',maxBufferLength:20});hls.loadSource(url);hls.attachMedia(video);hls.on(Hls.Events.MANIFEST_PARSED,()=>{setStatus(currentMode==='live'?'Direct prêt':'Replay prêt','ready');playWhenAllowed()});hls.on(Hls.Events.ERROR,(_,data)=>{if(!data.fatal)return;if(data.type===Hls.ErrorTypes.NETWORK_ERROR){setStatus('Réseau indisponible — nouvelle tentative…','error');hls.startLoad();return}if(data.type===Hls.ErrorTypes.MEDIA_ERROR){setStatus('Récupération du flux…','error');hls.recoverMediaError();return}setStatus('Erreur du flux','error')})}
else if(isHls&&video.canPlayType('application/vnd.apple.mpegurl')){video.src=url;video.addEventListener('loadedmetadata',()=>{setStatus(currentMode==='live'?'Direct prêt':'Replay prêt','ready');playWhenAllowed()},{once:true})}
else{video.src=url;video.addEventListener('loadedmetadata',()=>{setStatus('Replay prêt','ready');updateProgress();playWhenAllowed()},{once:true})}}
function togglePlay(){if(video.paused)playWhenAllowed();else video.pause()}
function setProgress(e){if(!isReplaySeekable())return;const rect=progressContainer.getBoundingClientRect(),pos=Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width));video.currentTime=pos*video.duration}
btnRewind.addEventListener('click',()=>{if(isReplaySeekable())video.currentTime=Math.max(0,video.currentTime-60)});
btnForward.addEventListener('click',()=>{if(isReplaySeekable())video.currentTime=Math.min(video.duration,video.currentTime+60)});
btnPlay.addEventListener('click',togglePlay);video.addEventListener('click',togglePlay);progressContainer.addEventListener('click',setProgress);
btnMute.addEventListener('click',()=>{video.muted=!video.muted;btnMute.textContent=video.muted?'🔇':'🔊';volumeSlider.value=video.muted?0:video.volume});
volumeSlider.addEventListener('input',e=>{video.volume=Number(e.target.value);video.muted=video.volume===0;btnMute.textContent=video.muted?'🔇':'🔊'});
btnFullscreen.addEventListener('click',()=>{if(!document.fullscreenElement)player.requestFullscreen?.();else document.exitFullscreen?.()});
video.addEventListener('timeupdate',updateProgress);video.addEventListener('loadedmetadata',updateProgress);video.addEventListener('durationchange',updateProgress);video.addEventListener('waiting',()=>setStatus('Chargement du flux…'));video.addEventListener('stalled',()=>setStatus('Flux en attente…','error'));video.addEventListener('error',()=>setStatus('Erreur de lecture du flux','error'));
video.addEventListener('play',()=>{btnPlay.textContent='❚❚ Pause';player.classList.remove('paused')});video.addEventListener('pause',()=>{btnPlay.textContent='▶ Lecture';player.classList.add('paused')});
window.NTS14LavaPlayer={name:'NTS-1.4-Lava',loadNTSMedia,loadYouTubeLive,loadRTIPlay,loadNCILive,cleanup,setStatus,getMode:()=>currentMode};
const params=new URLSearchParams(location.search);const url=params.get('stream');const mode=params.get('mode')||'replay';
if(url){loadNTSMedia(url,mode)}else if(window.StreamLiveChannelManager){if(window.STREAMLIVE_CHANNELS){const selected=window.StreamLiveChannelManager.selectFromUrl();if(!selected)setStatus('Prêt — aucun flux sélectionné')}else{setStatus('Chargement du catalogue…');window.addEventListener('streamlive:catalog-ready',()=>{const selected=window.StreamLiveChannelManager.selectFromUrl();if(!selected)setStatus('Prêt — aucun flux sélectionné')},{once:true});window.addEventListener('streamlive:catalog-error',()=>setStatus('Catalogue indisponible','error'),{once:true})}}else{setStatus('Prêt — aucun flux sélectionné');}
</script>
<script src="./catalog-loader.js"></script><script src="./channel-selector.js"></script><section class="channel-selector" aria-label="Sélection des chaînes"><div class="channel-toolbar"><input id="channel-search" type="search" placeholder="Rechercher une chaîne…" aria-label="Rechercher une chaîne" autocomplete="off"><select id="channel-group" aria-label="Filtrer par catégorie"><option value="">Toutes les catégories</option></select><button id="favorites-toggle" type="button" aria-pressed="false">☆ Favoris</button><button id="clear-filters" type="button">Réinitialiser</button></div><div id="channel-count" class="channel-feedback" aria-live="polite">Chargement du catalogue…</div><div id="channel-list" class="channel-list" aria-live="polite"></div><div id="channel-feedback" class="channel-feedback" aria-live="polite"></div></section></body>
</html>
